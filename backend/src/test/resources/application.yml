server:
  port: 0

spring:
  application:
    name: contractvault-test

  datasource:
    url: jdbc:h2:mem:contractvaulttest;DB_CLOSE_DELAY=-1
    driver-class-name: org.h2.Driver
    username: sa
    password: ""

  jpa:
    database-platform: org.hibernate.dialect.H2Dialect
    hibernate:
      ddl-auto: create-drop
    show-sql: false

  servlet:
    multipart:
      enabled: true
      max-file-size: 10MB
      max-request-size: 10MB

contractvault:
  storage:
    location: ./target/test-storage
